<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4;
    margin: 20mm 15mm 25mm 15mm;
    @bottom-center {
      {% if footer.show_page_numbers %}
      content: "Page " counter(page) " of " counter(pages);
      font-size: 9px;
      color: #666;
      {% endif %}
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: #333;
    line-height: 1.5;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background-color: {{ header.primary_color }};
    color: white;
    margin-bottom: 20px;
    border-radius: 4px;
  }

  .header-logo img {
    max-width: 160px;
    max-height: 60px;
  }

  .header-text {
    text-align: right;
  }

  .header-text h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .header-text p {
    font-size: 12px;
    opacity: 0.9;
  }

  .fields-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }

  .fields-table tr:nth-child(even) {
    background-color: {{ header.secondary_color }};
  }

  .fields-table td {
    padding: 10px 14px;
    border: 1px solid #ddd;
    vertical-align: top;
  }

  .field-label {
    font-weight: 600;
    color: #555;
    width: 35%;
  }

  .field-value {
    color: #222;
  }

  .footer-text {
    margin-top: 30px;
    padding-top: 10px;
    border-top: 1px solid #ccc;
    font-size: 9px;
    color: #888;
    text-align: center;
  }

  .generated-at {
    margin-top: 8px;
    font-size: 8px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    {% if header.show_logo and logo_data %}
    <div class="header-logo">
      <img src="data:image/png;base64,{{ logo_data }}" alt="Logo">
    </div>
    {% endif %}
    <div class="header-text">
      <h1>{{ header.bank_name }}</h1>
      <p>{{ header.subtitle }}</p>
    </div>
  </div>

  <table class="fields-table">
    {% for field in fields %}
    <tr>
      <td class="field-label">{{ field.label }}</td>
      <td class="field-value">{{ field.value }}</td>
    </tr>
    {% endfor %}
  </table>

  {% if footer.text %}
  <div class="footer-text">{{ footer.text }}</div>
  {% endif %}

  <div class="generated-at">Generated on {{ generated_at }}</div>
</body>
</html>
